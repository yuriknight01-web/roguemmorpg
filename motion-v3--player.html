<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新版角色动作</title><style>body{margin:0;background:#101724;color:#e6efff;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:24px}p{color:#b4c3d8;line-height:1.7}a{color:#b7d9ff}canvas{width:100%;background:#192538;border-radius:12px;image-rendering:pixelated}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}button,select{padding:10px;color:#eef4ff;background:#293b55;border:1px solid #4f6687;border-radius:6px;cursor:pointer}input{width:100%}#frames{display:flex;gap:8px;flex-wrap:wrap}#frames button[aria-pressed=true]{background:#62568f}small{color:#adbed4}</style><main><a href="motion-gallery.html" target="_top">← 全部角色动作</a><h1 id="title"></h1><p id="desc"></p><canvas id="stage" width="1000" height="440" aria-label="新版动作预览"></canvas><div class="controls"><button id="play">播放攻击</button><button id="pause">暂停 / 继续</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速</option></select><label><input id="compare" type="checkbox" checked style="width:auto"> 原始待机对照</label><output id="state">加载中</output></div><input id="scrub" aria-label="动作进度" type="range" min="0" value="0"><div id="frames"></div><p><small>新版动作试播。整帧切换、等比缩放；可逐帧检查造型和持握。旧版保留，未覆盖原始角色素材。</small></p><p id="reference"></p></main><script src="motion-v3--player.js?v=2"></script></html>
